name: Build Bee DB Manager

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Prepare sources
        run: |
          cp "Source code/main.py" .
          cp "Source code/repl.py" .
          cp "Source code/db_adapters.py" .

      - name: Convert icon for Windows
        if: matrix.os == 'windows-latest'
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.ico', sizes=[(256,256),(128,128),(96,96),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.png main.py

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.ico main.py

      - name: Upload Linux binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bee-db-linux
          path: dist/bee-db
          if-no-files-found: error

      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bee-db-windows
          path: dist/bee-db.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-linux
          path: release/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-windows
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/bee-db
            release/bee-db.exe
          generate_release_notes: true
          draft: false
          prerelease: false
