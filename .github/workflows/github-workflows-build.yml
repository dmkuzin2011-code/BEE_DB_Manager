name: Build Bee DB Manager

on:
  push:
    branches: [main, nightly]
    tags: ['v*', 'nv*']
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
            ext: ""
          - os: windows-latest
            suffix: windows
            ext: ".exe"
          - os: macos-latest
            suffix: macos
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Prepare sources
        run: |
          cp "Source code/main.py" .
          cp "Source code/repl.py" .
          cp "Source code/db_adapters.py" .

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/nv* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binary
        run: pyinstaller --noconfirm --onefile --name bee-db main.py

      - name: Rename with version
        id: rename
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC="dist/bee-db${{ matrix.ext }}"
          DST="dist/bee-db-${VERSION}-${{ matrix.suffix }}${{ matrix.ext }}"
          mv "$SRC" "$DST"
          echo "file=$DST" >> $GITHUB_OUTPUT
          echo "Renamed to: $DST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-db-${{ matrix.suffix }}${{ matrix.ext }}
          path: ${{ steps.rename.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/nv')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-linux
          path: release/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-windows.exe
          path: release/

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-macos
          path: release/

      - name: Set prerelease flag
        id: flags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/nv* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "type=NIGHTLY"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "type=STABLE"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.flags.outputs.prerelease }}
