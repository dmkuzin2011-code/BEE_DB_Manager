name: Build Bee DB Manager

on:
  push:
    branches: [main, nightly]
    tags: ['v*', 'nv*']
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
            ext: ""
          - os: windows-latest
            suffix: windows
            ext: ".exe"
          - os: macos-latest
            suffix: macos
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Convert icon for Windows (.ico)
        if: matrix.os == 'windows-latest'
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Convert icon for macOS (.icns)
        if: matrix.os == 'macos-latest'
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.icns')"

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.png --paths "Source code" "Source code/main.py"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.ico --paths "Source code" "Source code/main.py"

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.icns --paths "Source code" "Source code/main.py"

      - name: Update version file
        run: |
          python -c "import os; open('Source code/version.py', 'w', encoding='utf-8').write(f'__version__ = \"{os.environ[\"GITHUB_REF_NAME\"].lstrip(\"v\")}\"\n')"


  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/nv')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-linux
          path: release/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-windows.exe
          path: release/

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-macos
          path: release/

      - name: Set prerelease flag
        id: flags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/nv* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "type=NIGHTLY"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "type=STABLE"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.flags.outputs.prerelease }}
