name: Build Bee DB Manager

on:
  push:
    branches: [main, nightly]
    tags: ['v*', 'nv*', 'nightly', 'stable']
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
            ext: ""
          - os: windows-latest
            suffix: windows
            ext: ".exe"
          - os: macos-latest
            suffix: macos
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Prepare sources
        run: |
          cp "Source code/main.py" .
          cp "Source code/repl.py" .
          cp "Source code/db_adapters.py" .

      - name: Sync version from tag or branch
        shell: bash
        run: |
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"
          
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
          elif [[ "$REF" == refs/tags/nv* ]]; then
            VERSION="${REF_NAME#nv}"
          elif [[ "$REF" == refs/tags/nightly ]]; then
            VERSION="nightly-${GITHUB_RUN_NUMBER}"
          elif [[ "$REF" == refs/tags/stable ]]; then
            VERSION="stable-${GITHUB_RUN_NUMBER}"
          elif [[ "$REF" == refs/heads/nightly ]]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="nightly-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="dev-${SHORT_SHA}"
          fi
          
          echo "__version__ = \"$VERSION\"" > version.py
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat version.py
        id: version

      - name: Convert icon for Windows (.ico)
        if: matrix.os == 'windows-latest'
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Convert icon for macOS (.icns)
        if: matrix.os == 'macos-latest'
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.icns')"

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.png main.py

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.ico main.py

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller --noconfirm --onefile --name bee-db --icon assets/icon.icns main.py

      - name: Rename with version
        id: rename
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC="dist/bee-db${{ matrix.ext }}"
          DST="dist/bee-db-${VERSION}-${{ matrix.suffix }}${{ matrix.ext }}"
          mv "$SRC" "$DST"
          echo "file=$DST" >> $GITHUB_OUTPUT
          echo "Renamed to: $DST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-db-${{ matrix.suffix }}${{ matrix.ext }}
          path: ${{ steps.rename.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/nv') || github.ref == 'refs/tags/nightly' || github.ref == 'refs/tags/stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-linux
          path: release/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-windows.exe
          path: release/

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: bee-db-macos
          path: release/

      - name: Set prerelease flag
        id: flags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/nv* || "${{ github.ref }}" == refs/tags/nightly ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.flags.outputs.prerelease }}